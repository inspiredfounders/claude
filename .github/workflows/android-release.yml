name: Android Release (Play Console)

# Builds a signed release AAB and uploads it to Google Play's internal
# testing track. Runs only when triggered manually (Actions tab → this
# workflow → "Run workflow"), and only once the secrets below are set
# (Settings → Secrets and variables → Actions → New repository secret).
# Until then this workflow exists but has nothing to sign or upload with,
# so leave it un-run.
#
# Required secrets:
#   ANDROID_KEYSTORE_BASE64      Your release keystore (.jks/.keystore),
#                                base64-encoded: `base64 -i my-release.keystore`.
#                                Generate it once with `keytool -genkeypair`
#                                and back the original file up somewhere
#                                safe — losing it means you can never
#                                update this app listing again.
#   ANDROID_KEYSTORE_PASSWORD    Password for the keystore file itself.
#   ANDROID_KEY_ALIAS            The key's alias inside the keystore.
#   ANDROID_KEY_PASSWORD         Password for that specific key.
#   PLAY_SERVICE_ACCOUNT_JSON    A Google Cloud service account key (JSON)
#                                with "Release manager" access on this app
#                                in Play Console → Users and permissions →
#                                Invite new users → choose "Service account".
#                                Paste the whole JSON file's contents.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Console track to upload to"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  release:
    name: Build & upload signed AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Assemble signed release AAB
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload to Play Console
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.inspiredfounders.club
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
