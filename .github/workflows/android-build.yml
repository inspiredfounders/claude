name: Android Compile Check

# Builds an unsigned debug APK on every change — no signing, no Play
# Console credentials needed. Just proves the native wrapper still
# compiles. The signed, Play-uploading build lives in android-release.yml
# and only runs on demand once its secrets are set.

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build web bundle
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug
