name: iOS Release (TestFlight)

# Builds a signed archive and uploads it to TestFlight. Runs only when you
# trigger it manually (Actions tab → this workflow → "Run workflow"), and
# only once the secrets below are set (Settings → Secrets and variables →
# Actions → New repository secret). Until then this workflow exists but
# has nothing to authenticate with, so leave it un-run.
#
# Required secrets:
#   APPLE_TEAM_ID                 Found in developer.apple.com → Membership.
#   APPSTORE_ISSUER_ID            App Store Connect → Users and Access → Keys.
#   APPSTORE_KEY_ID               Same page, after generating a key.
#   APPSTORE_PRIVATE_KEY          The .p8 file's contents (generate once,
#                                 download immediately — Apple only shows it
#                                 once). Paste the whole file, including the
#                                 BEGIN/END lines.
#
# This uses Xcode's automatic-signing-in-CI mode (-allowProvisioningUpdates
# with an App Store Connect API key) — Xcode creates and manages the
# distribution certificate and provisioning profile itself using that key,
# so there's no separate .p12/.mobileprovision export step to maintain.

on:
  workflow_dispatch:

jobs:
  release:
    name: Archive & upload to TestFlight
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Generate iOS project
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios/App
        run: pod install

      - name: Write App Store Connect API key
        working-directory: apps/mobile/ios/App
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPSTORE_PRIVATE_KEY" > ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8

      - name: Archive (automatic signing via App Store Connect API key)
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }} \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            archive

      - name: Write export options
        working-directory: apps/mobile/ios/App
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF

      - name: Export .ipa
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }}

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/App.ipa" \
            --apiKey ${{ secrets.APPSTORE_KEY_ID }} \
            --apiIssuer ${{ secrets.APPSTORE_ISSUER_ID }}
